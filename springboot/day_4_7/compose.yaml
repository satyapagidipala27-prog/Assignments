
services:

  db:
    image: postgres:17-alpine
    container_name: student-db

    environment:
      POSTGRES_DB: student_assignment_db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d student_assignment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  api:
    build: .
    image: student-api:v2
    container_name: student-api

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://db:5432/student_assignment_db
      DB_USERNAME: appuser
      SPRING_CONFIG_IMPORT: "configtree:/run/secrets/"

    secrets:
      - db_password

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 768m
    cpus: 1.0

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: unless-stopped

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password.txt
